databaseChangeLog:
  - changeSet:
      id: 20260817-01-create-decks
      author: arkana
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: decks
      changes:
        - createTable:
            tableName: decks
            columns:
              - column: { name: id, type: varchar(40), constraints: { primaryKey: true, nullable: false } }
              - column: { name: display_order, type: smallint, constraints: { nullable: false, unique: true } }
              - column: { name: name_pt_br, type: varchar(160), constraints: { nullable: false } }
              - column: { name: name_en, type: varchar(160), constraints: { nullable: false } }
              - column: { name: card_count, type: smallint, constraints: { nullable: false } }
              - column: { name: active, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
  - changeSet:
      id: 20260817-02-seed-rider-waite-deck
      author: arkana
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck: { expectedResult: 0, sql: select count(*) from public.decks }
      changes:
        - insert:
            tableName: decks
            columns:
              - column: { name: id, value: rider-waite }
              - column: { name: display_order, valueNumeric: 1 }
              - column: { name: name_pt_br, value: "Rider-Waite" }
              - column: { name: name_en, value: "Rider-Waite" }
              - column: { name: card_count, valueNumeric: 78 }
              - column: { name: active, valueBoolean: true }
