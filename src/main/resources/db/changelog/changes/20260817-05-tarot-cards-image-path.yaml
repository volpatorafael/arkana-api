databaseChangeLog:
  - changeSet:
      id: 20260817-05-tarot-cards-image-path
      author: arkana
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: tarot_cards
                columnName: image_path
      changes:
        - addColumn:
            tableName: tarot_cards
            columns:
              - column:
                  name: image_path
                  type: varchar(80)
