spring:
  main:
    banner-mode: off
  application:
    name: arkana-api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI}
          audiences: ${OAUTH2_AUDIENCE}

arkana:
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:Arkana <hello@arkana.app>}
  abacatepay:
    api-key: ${ABACATEPAY_API_KEY:}
    webhook-secret: ${ABACATEPAY_WEBHOOK_SECRET:}
    webhook-hmac-key: ${ABACATEPAY_WEBHOOK_HMAC_KEY:}
  reconciliation-secret: ${ARKANA_RECONCILIATION_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
