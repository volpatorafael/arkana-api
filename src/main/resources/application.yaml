spring:
  main:
    banner-mode: off
  application:
    name: arkana-api
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI}
          audiences: authenticated
          jws-algorithms: ES256

arkana:
  billing:
    provider: ${BILLING_PROVIDER:ASAAS}
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:Arkana <hello@getarkana.com>}
  abacatepay:
    api-key: ${ABACATEPAY_API_KEY:}
    webhook-secret: ${ABACATEPAY_WEBHOOK_SECRET:}
    webhook-hmac-key: ${ABACATEPAY_WEBHOOK_HMAC_KEY:}
  asaas:
    api-key: ${ASAAS_API_KEY:}
    api-url: ${ASAAS_API_URL:https://api-sandbox.asaas.com/v3}
    webhook-token: ${ASAAS_WEBHOOK_TOKEN:}
  efi:
    client-id: ${EFI_CLIENT_ID:}
    client-secret: ${EFI_CLIENT_SECRET:}
    charges-url: ${EFI_CHARGES_URL:https://cobrancas-h.api.efipay.com.br}
    pix-url: ${EFI_PIX_URL:https://pix-h.api.efipay.com.br}
    pix-key: ${EFI_PIX_KEY:}
    pix-automatic-enabled: ${EFI_PIX_AUTOMATIC_ENABLED:false}
    certificate-path: ${EFI_CERTIFICATE_PATH:}
    certificate-password: ${EFI_CERTIFICATE_PASSWORD:}
    charges-webhook-secret: ${EFI_CHARGES_WEBHOOK_SECRET:}
    pix-webhook-secret: ${EFI_PIX_WEBHOOK_SECRET:}
    pix-webhook-hmac-key: ${EFI_PIX_WEBHOOK_HMAC_KEY:}
    pix-require-mtls: ${EFI_PIX_REQUIRE_MTLS:false}
  webhook-base-url: ${ARKANA_WEBHOOK_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: error
    com.arkana: info
  pattern:
    console: "%clr(%d{${LOG_DATEFORMAT_PATTERN:yyyy-MM-dd HH:mm:ss.SSS}}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) %clr(${PID: }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m %replace(requestId=%mdc{requestId} ){'requestId= ',''}%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}"
