spring:
  main:
    banner-mode: off
  application:
    name: arkana-api
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI}
          audiences: ${OAUTH2_AUDIENCE}

arkana:
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:Arkana <hello@arkana.app>}
  abacatepay:
    api-key: ${ABACATEPAY_API_KEY:}
    webhook-secret: ${ABACATEPAY_WEBHOOK_SECRET:}
    webhook-hmac-key: ${ABACATEPAY_WEBHOOK_HMAC_KEY:}
  reconciliation-secret: ${ARKANA_RECONCILIATION_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: error
    com.arkana: info
  pattern:
    console: "%clr(%d{${LOG_DATEFORMAT_PATTERN:yyyy-MM-dd HH:mm:ss.SSS}}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) %clr(${PID: }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m %replace(requestId=%mdc{requestId} ){'requestId= ',''}%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}"
