spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/arkana
    username: arkana
    password: arkana
  jpa:
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://gkjmdasjrapvegjywcof.supabase.co/auth/v1
          jwk-set-uri: https://gkjmdasjrapvegjywcof.supabase.co/auth/v1/.well-known/jwks.json
          audiences: authenticated

arkana:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  app-url: http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

